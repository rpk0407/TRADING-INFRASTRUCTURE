[project]
name = "nexus-ai"
version = "1.0.0"
description = "NEXUS AI — Agentic Workflow Infrastructure for Business Automation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
